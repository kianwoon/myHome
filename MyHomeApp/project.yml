# xcodegen spec for MyHome.xcodeproj — the Xcode path to a signed app bundle
# with Info.plist, entitlements and App Intents metadata (Siri / Shortcuts).
#
# Regenerate after adding files under Sources/MyHomeApp:
#   cd MyHomeApp && xcodegen generate        (brew install xcodegen)
#
# The app target compiles the SAME Sources/MyHomeApp files `swift build` does
# and depends on the MyHomeCore library product of this package (path: .), so
# there is one source of truth for the core. `swift build` / `swift test`
# remain the CI path; the Xcode project adds the bundle-only features
# (usage-description prompts, App Intents extraction, hardened runtime).
name: MyHome
options:
  bundleIdPrefix: com.myhome
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

packages:
  MyHomeCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing for local runs; set a team in Xcode (or an xcconfig
    # that is not checked in) for a distributable build.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  MyHome:
    type: application
    platform: macOS
    sources:
      - path: Sources/MyHomeApp
    dependencies:
      - package: MyHomeCore
        product: MyHomeCore
    settings:
      base:
        PRODUCT_NAME: MyHome
        PRODUCT_BUNDLE_IDENTIFIER: com.myhome.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Xcode/Info.plist
        CODE_SIGN_ENTITLEMENTS: Xcode/MyHome.entitlements
        # Hardened Runtime, not App Sandbox: the app spawns the Python bridge
        # and reaches devices over LAN/BLE, which the sandbox would block.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      testTargets: []
      environmentVariables:
        # Dev runs from DerivedData: point the bridge at this checkout.
        MYHOME_BRIDGE_DIR: "$(SRCROOT)/.."
